apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vollmint.fullname" . }}-sync
  labels:
    {{- include "vollmint.syncLabels" . | nindent 6 }}
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  timeZone: Etc/UTC
  suspend: {{ .Values.sync.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "vollmint.syncLabels" . | nindent 10 }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "vollmint.syncLabels" . | nindent 14 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["sync"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secretName }}
                      key: {{ .Values.database.secretKey }}
                - name: SIMPLEFIN_ACCESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.sync.simplefinSecretName }}
                      key: {{ .Values.sync.simplefinSecretKey }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                {{- toYaml .Values.sync.resources | nindent 18 }}
